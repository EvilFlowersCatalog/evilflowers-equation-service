[project]
name = "evilflowers-equation-service"
version = "1.0.0"
description = "Celery worker of the EvilFlowers catalog: equation regions as WebP crops and LaTeX (IP-018)"
readme = "README.md"
authors = [{ name = "Jakub Dubec", email = "jakub.dubec@stuba.sk" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # The shared runtime of the extraction workers: contract, catalog client, LeafJob, Celery app, shutdown,
    # delivery cap and telemetry (#7). Pinned in [tool.uv.sources].
    "evilflowers-worker",
    "celery[redis]>=5.6,<6",
    "pillow>=11",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    "pymupdf>=1.26",
    "python-dotenv>=1.0",
    "requests>=2.32",
    # sympy's LaTeX parser needs the ANTLR runtime of the grammar sympy ships (4.11).
    "sympy>=1.14",
    "antlr4-python3-runtime==4.11.*",
]

[project.optional-dependencies]
# LATEX_BACKEND=onnx: LaTeX-OCR (pix2tex) on ONNX Runtime, CPU. Imported lazily; without it the tests that
# guard its session wiring are skipped (CI installs it).
onnx = [
    # Pinned: `latex.OnnxRecognizer` passes the weight paths to its constructor and swaps the
    # `OrtInferSession` of its `main` and `models` modules to set the thread count (LATEX_THREADS).
    "rapid-latex-ocr==0.0.9",
]
# The standalone task's render check (FORMULAS_MIN_SIMILARITY): LaTeX drawn by matplotlib's mathtext. Imported
# lazily; without it the check leaves formulas unchecked and its test is skipped (CI installs it).
check = ["matplotlib>=3.9"]
# OTLP/HTTP to the node's Alloy (the kit's pinned SDK, exporter and instrumentations).
otel = ["evilflowers-worker[otel]"]
# Pyroscope SDK: Python frames the node's eBPF profiler cannot unwind; on only with PYROSCOPE_SERVER_ADDRESS.
profiling = ["evilflowers-worker[profiling]"]

[dependency-groups]
# `uv sync` installs the core and this group only.
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.uv.sources]
# Referenced by its master branch, not a commit. CI locks it per build, never committed (evilflowers-actions
# resolve-worker, evilflowers-worker#13): develop and PRs follow master's head, main and tags the kit's newest release
# tag (v0.1.0 = eb1d19c on 2026-11-22), rewriting this line to `tag = "…"` for that build only. The committed uv.lock
# entry only serves local development; the image records the commit it got (IMAGE_TAG, OCI labels).
# worker-nightly.yml rebuilds and redeploys develop when master moves.
# Needs `contract.StandaloneJob`, `runtime.run_task`, `outcome.write_outcome` (#5), so master @ e530f68 or later.
evilflowers-worker = { git = "https://github.com/EvilFlowersCatalog/evilflowers-worker", branch = "master" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evilflowers_equation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]

[tool.ruff]
line-length = 119
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "LOG", "G"]

[tool.ruff.lint.isort]
known-first-party = ["evilflowers_equation"]
