[project]
name = "evilflowers-equation-service"
version = "1.0.0"
description = "Celery worker of the EvilFlowers catalog: equation regions as WebP crops and LaTeX (IP-018)"
readme = "README.md"
authors = [{ name = "Jakub Dubec", email = "jakub.dubec@stuba.sk" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.6,<6",
    "pillow>=11",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    "pymupdf>=1.26",
    "python-dotenv>=1.0",
    "requests>=2.32",
    # sympy's LaTeX parser needs the ANTLR runtime of the grammar sympy ships (4.11).
    "sympy>=1.14",
    "antlr4-python3-runtime==4.11.*",
    # IP-019: code uses the API only, a no-op without the `otel` extra. One release train with the catalog.
    "opentelemetry-api==1.45.2",
]

[project.optional-dependencies]
# LATEX_BACKEND=onnx: LaTeX-OCR (pix2tex) on ONNX Runtime, CPU. Imported lazily; without it the tests that
# guard its session wiring are skipped (CI installs it).
onnx = [
    # Pinned: `latex.OnnxRecognizer` passes the weight paths to its constructor and swaps the
    # `OrtInferSession` of its `main` and `models` modules to set the thread count (LATEX_THREADS).
    "rapid-latex-ocr==0.0.9",
]
# OTLP/HTTP to the node's Alloy; SDK/exporter 1.x and contrib 0.yb0 move together (as in the catalog).
otel = [
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-celery==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-instrumentation-system-metrics==0.66b2",
]
# Pyroscope SDK: Python frames the node's eBPF profiler cannot unwind; on only with PYROSCOPE_SERVER_ADDRESS.
profiling = [
    "pyroscope-io==1.4.0",
    "pyroscope-otel==1.1.0",
]

[dependency-groups]
# `uv sync` installs the core and this group only.
dev = [
    "opentelemetry-sdk==1.45.2",
    "pytest>=8.3",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evilflowers_equation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]

[tool.ruff]
line-length = 119
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "LOG", "G"]

[tool.ruff.lint.isort]
known-first-party = ["evilflowers_equation"]
