# Keep the dev deploy on the latest evilflowers-worker master. Commits nothing.
#
# The unified worker-kit nightly (EvilFlowersCatalog/evilflowers-worker#13, rule 3), from evilflowers-actions
# (.github/workflows/worker-nightly.yml):
#
#   every night, or by hand
#     1. read evilflowers-worker master's commit (git ls-remote) and the worker commit of the :develop image
#        (OCI label sk.stuba.elvira.evilflowers-worker.revision)
#     2. equal      → nothing (no image, no restart: a Recreate restart costs the model load)
#        different  → dispatch docker-publish.yml on develop with reason=nightly: it re-locks the worker
#                     to master, tests, builds, pushes :develop, deploys to evilflowers-dev, checks the digest and
#                     reports the deploy to LGTM (evilflowers.deploy.trigger=nightly); if it fails, it opens (or
#                     comments) one GitHub issue "nightly: evilflowers-worker <sha> breaks evilflowers-equation-service"
#        vars.KIT_REF set (a hold) → nothing, unless `force`: :develop is built on that ref and never matches master
#
# It acts on develop only: prod (main) follows the kit's release tags (resolve-worker) and is never rebuilt by a
# schedule.
#
# evilflowers-actions is referenced at @master: it has no release tag yet. Move to a tag once it is cut, together
# with docker-publish.yml and test.yml.
#
# A schedule only fires from the default branch's copy of this file: it is live once this file is on main.

name: Nightly evilflowers-worker

on:
  schedule:
    - cron: "17 2 * * *"           # 02:17 UTC, outside the working day; not on the hour (GitHub's busiest minute)
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and redeploy even if :develop already has master's worker (ignores a hold)
        type: boolean
        default: false

permissions: {}

jobs:
  nightly:
    uses: EvilFlowersCatalog/evilflowers-actions/.github/workflows/worker-nightly.yml@master
    permissions:
      actions: write                 # dispatch docker-publish.yml
      packages: read                 # read the :develop image's labels
    with:
      workflow: docker-publish.yml
      force: ${{ inputs.force || false }}
      kit-ref: ${{ vars.KIT_REF }}
