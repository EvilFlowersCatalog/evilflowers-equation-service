# Lint and test against the evilflowers-worker ref this branch follows, for docker-publish.yml.
#
# pyproject.toml references the worker by `branch = "master"`. The committed uv.lock only serves local
# development, so it is never trusted for the worker: scripts/resolve-worker.sh re-locks it first (develop and PRs:
# the kit's master head; main and tags: its newest release tag v*.*.*; vars.KIT_REF: a hold on that ref), this job
# tests with that, and uploads the re-locked uv.lock and pyproject.toml as the artifact `uv-lock`. The image is then
# built from exactly the lock tested here, even if master moves in between.

name: test

on:
  workflow_call:
    outputs:
      worker:
        description: evilflowers-worker commit tested
        value: ${{ jobs.test.outputs.worker }}
      worker-ref:
        description: evilflowers-worker ref it was resolved from (master or a release tag v*.*.*)
        value: ${{ jobs.test.outputs.worker-ref }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # tests/test_worker.py runs the image's app as a real prefork worker (evilflowers_worker.testing.WorkerProcess)
    # against this Redis; with `CI` set it fails instead of skipping when Redis does not answer.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    outputs:
      worker: ${{ steps.worker.outputs.revision }}
      worker-ref: ${{ steps.worker.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # Outputs ref (master | v1.2.3) and revision (the commit uv.lock pins). It is the proposed shared
      # `resolve-worker` action of evilflowers-actions#1.
      - name: Resolve evilflowers-worker
        id: worker
        env:
          # A hold (repository variable): every build uses this kit ref, e.g. a known-good tag while master is broken.
          KIT_REF: ${{ vars.KIT_REF }}
        run: bash scripts/resolve-worker.sh

      # Core + dev group + rapid-latex-ocr (tests/test_latex.py guards how its ONNX sessions are built);
      # no exporters, no Pyroscope.
      - name: Install
        run: uv sync --locked --extra onnx --extra check
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Test
        run: uv run pytest -q

      # pyproject.toml too: on main and tags it points the kit at the release tag the lock was resolved from.
      - name: Upload the re-locked uv.lock
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: |
            uv.lock
            pyproject.toml
          retention-days: 7
