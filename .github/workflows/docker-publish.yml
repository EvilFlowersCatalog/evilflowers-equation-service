# Equation service image: test, build and push to GHCR; deploy `develop` to the dev environment.
#
#   push to develop  → test, push :develop :sha-<short>, deploy to k3s ns evilflowers-dev
#   push to main     → test, push :main :sha-<short>              (no deploy)
#   tag v*.*.*       → test, push :<version> :sha-<short>         (no deploy)
#   pull request     → test, build (no push)
#   manual           → as a push of the chosen ref
#   worker-nightly   → a manual run on develop (reason=worker-nightly) when evilflowers-worker master moved
#                      past the :develop image; a failure then opens (or comments) one GitHub issue
#
# evilflowers-worker is referenced by its master branch (pyproject.toml): test.yml re-locks it to master's
# current commit on every run and the image is built from that tested uv.lock, not the committed one.
#
# Every image carries the evilflowers-worker commit it was built with: in IMAGE_TAG
# (`<ref>@<sha>+worker.<short>`, hence OpenTelemetry service.version and every run's provenance) and in
# the OCI label `sk.stuba.elvira.evilflowers-worker.revision`.
#
# Every deploy is reported to LGTM by evilflowers-actions' scripts/otlp-deploy.sh (contract: knowledge,
# Proposals/CI-Deploy-Unification): a Loki event and a Tempo span `deploy`, service.name github-actions.
#
# Deploy (contract: knowledge base, Cookbooks/Deploy-a-Service §4 and CI-Runner): the dev
# Deployment `equation` runs this image on a floating tag with
# imagePullPolicy Always, so a new image goes live with a rollout restart. The `deploy` job
# runs on the self-hosted runner INSIDE k3s (runs-on: elvira-k3s), whose ServiceAccount may
# restart Deployments only in the namespaces of `github_runner_deploy_namespaces`
# (roles/github_runner). It then checks that the running pods use the digest just pushed.
#
# Prerequisites outside this repo (one time, EvilFlowersCatalog/knowledge#21): this repo in the
# runner group `elvira-k3s`, and the dev instance pinned to `evilflowers-equation-service:develop`
# (group_vars/all/evilflowers.yml). `evilflowers-dev` is already in
# `github_runner_deploy_namespaces` (text deploys there). Until the pin moves, the digest check
# fails on purpose: the pods would still be running :main.

name: Docker Build and Push

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:
    inputs:
      reason:
        description: Why the run was started (worker-nightly sets worker-nightly)
        type: string
        default: manual

# Concurrency is per job, not per workflow: a newer push to the same ref cancels the older
# test/build, while `deploy` has its own group that never cancels, so a rollout in progress
# always finishes (a workflow-level group would cancel it too).

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lint and tests against evilflowers-worker master; uploads the re-locked uv.lock.
  test:
    concurrency:
      group: equation-test-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: equation-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      worker: ${{ needs.test.outputs.worker }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The uv.lock test.yml re-locked to evilflowers-worker master and tested, over the committed one: the
      # image gets exactly the worker that passed, even if master moved since.
      - uses: actions/download-artifact@v4
        with:
          name: uv-lock

      - name: evilflowers-worker revision
        id: worker
        env:
          WORKER: ${{ needs.test.outputs.worker }}
        run: |
          test -n "$WORKER"
          grep -q "evilflowers-worker?branch=master#${WORKER}" uv.lock
          echo "short=${WORKER::7}" >> "$GITHUB_OUTPUT"

      # A buildx builder: the `gha` layer cache needs it.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
          labels: |
            sk.stuba.elvira.evilflowers-worker.revision=${{ needs.test.outputs.worker }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The dependency layer rarely changes; reuse it across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Recorded in every extraction run's provenance (IP-018) and as the
          # OpenTelemetry service.version of the worker, with the evilflowers-worker commit.
          build-args: |
            IMAGE_TAG=${{ github.ref_name }}@${{ github.sha }}+worker.${{ steps.worker.outputs.short }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo "evilflowers-worker: ${{ needs.test.outputs.worker }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: elvira-k3s            # ARC scale set in k3s (knowledge: roles/github_runner)
    environment:
      name: development
    concurrency:
      group: deploy-equation-evilflowers-dev
      cancel-in-progress: false
    permissions: {}
    env:
      NAMESPACE: evilflowers-dev
      # Space-separated Deployments that run this image.
      DEPLOYMENTS: equation
      DIGEST: ${{ needs.build-and-push.outputs.digest }}
      WORKER: ${{ needs.build-and-push.outputs.worker }}
      # Read by scripts/otlp-deploy.sh.
      TARGET_ENVIRONMENT: development
      TARGET_NAMESPACE: evilflowers-dev
      DEPLOY_DEPLOYMENTS: equation
      IMAGE: ghcr.io/evilflowerscatalog/evilflowers-equation-service
      # evilflowers-actions has no v1 tag yet: the script at a fixed commit, until this job moves to its deploy.yml.
      OTLP_DEPLOY_REF: 7d1a7fc27a9e441f928e9fc24352fc58495f6b3e
      KUBECTL_VERSION: v1.31.5     # = the cluster (k3s v1.31.5+k3s1)
      KUBECTL_SHA256: fbecbfd375b3686002c2e81d51c390172f5ffba3d6b47920d55342cb03f557af   # dl.k8s.io …/linux/amd64/kubectl.sha256
    steps:
      # The runner image has no kubectl. The pod is deleted after the job, so nothing is cached.
      - name: kubectl ${{ env.KUBECTL_VERSION }} (checksum-pinned)
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # In-cluster credentials: the pod's ServiceAccount arc-deployer.
      - name: Restart onto the new :develop
        run: |
          echo "DEPLOY_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"
          for deployment in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" rollout restart "deployment/$deployment"
          done

      # Strategy Recreate and no probes (Celery workers have no port): `rollout status` returns
      # once the new pod is Running.
      - name: Wait for the rollouts
        run: |
          for deployment in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$deployment" --timeout=600s
          done

      # :develop could have moved (a newer push built while this rolled out), or the pull could
      # have failed silently onto a cached layer. Pods still terminating are skipped.
      - name: Running pods use ${{ env.DIGEST }}
        run: |
          failed=0
          for deployment in $DEPLOYMENTS; do
            ids=$(kubectl -n "$NAMESPACE" get pods -l "app.kubernetes.io/name=$deployment" \
              -o go-template='{{range .items}}{{if not .metadata.deletionTimestamp}}{{range .status.containerStatuses}}{{.imageID}}{{"\n"}}{{end}}{{end}}{{end}}')
            echo "$deployment:"
            echo "$ids"
            if [ -z "$ids" ]; then
              echo "::error::no running pod of $deployment"
              failed=1
            elif echo "$ids" | grep -v -- "@${DIGEST}\$"; then
              echo "::error::a running pod of $deployment does not use ${DIGEST}"
              failed=1
            fi
          done
          echo "DEPLOY_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"
          exit "$failed"

      # Loki event + Tempo span to the node's Alloy ($ELVIRA_OTLP_HTTP_ENDPOINT on the runner pod). Never fails the
      # job. A run cancelled by a newer one reports nothing; the newer run reports its own.
      - name: Report the deploy to LGTM
        id: otlp
        if: success() || failure()
        env:
          OUTCOME: ${{ job.status == 'success' && 'succeeded' || 'failed' }}
        run: |
          script="$RUNNER_TEMP/otlp-deploy.sh"
          if curl -fsSL --max-time 20 -o "$script" \
            "https://raw.githubusercontent.com/EvilFlowersCatalog/evilflowers-actions/${OTLP_DEPLOY_REF}/scripts/otlp-deploy.sh"; then
            bash "$script" "$OUTCOME" || echo "::warning::otlp-deploy.sh failed; the deploy itself is unaffected"
          else
            echo "::warning::could not fetch otlp-deploy.sh at ${OTLP_DEPLOY_REF}; deploy event not sent"
          fi

      - name: Summary
        if: always()
        env:
          TRACE_ID: ${{ steps.otlp.outputs.trace_id }}
          REASON: ${{ inputs.reason || github.event_name }}
        run: |
          {
            echo "### Deploy to ${NAMESPACE}: ${{ job.status }} (${REASON})"
            echo
            echo "Digest \`${DIGEST}\`, commit \`${GITHUB_SHA::7}\`, evilflowers-worker \`${WORKER::7}\`."
            echo
            echo '```'
            kubectl -n "$NAMESPACE" get pods -o wide \
              -l 'app.kubernetes.io/name=equation' 2>&1 || true
            echo '```'
            echo
            echo "Grafana (VPN): http://grafana.observability.stu.k8s.internal → Explore"
            echo "- Deploy event: \`{service_name=\"github-actions\"} | event_name=\"deployment\" | vcs_ref_head_revision=\"${GITHUB_SHA}\"\`${TRACE_ID:+, trace \`${TRACE_ID}\`}"
            echo "- Running worker: \`{resource.service.name=\"equation\" && resource.service.version=~\".*worker.${WORKER::7}\"}\`"
            echo "- Tempo: \`{resource.service.name=\"equation\" && kind=consumer}\`"
            echo "- Loki: \`{namespace=\"${NAMESPACE}\", service_name=\"equation\"} | json\`"
            echo "- Mimir: \`equation_task_duration_seconds_bucket\`, \`equation_recognition_duration_seconds_bucket\`, \`equation_job_outcome_total\`"
            echo "- Pyroscope: \`{service_name=\"equation\", namespace=\"${NAMESPACE}\"}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # A nightly rebuild that fails (most likely: the new worker breaks lint or tests) leaves :develop and the dev
  # pod on the last worker that passed, and the nightly retries every night. One open issue collects the failures,
  # a comment per night, instead of a new issue each night.
  report-nightly-failure:
    needs: [test, build-and-push, deploy]
    if: failure() && inputs.reason == 'worker-nightly'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WORKER: ${{ needs.test.outputs.worker }}
      TITLE: "Nightly: develop fails on the latest evilflowers-worker"
      RESULTS: "test ${{ needs.test.result }}, build ${{ needs.build-and-push.result }}, deploy ${{ needs.deploy.result }}"
    steps:
      - run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf 'The nightly rebuild of develop on evilflowers-worker master `%s` failed (%s): %s\n\n:develop and the dev pod keep the last worker that passed; the nightly retries every night.' \
            "${WORKER:-unknown}" "$RESULTS" "$run_url")
          number=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
